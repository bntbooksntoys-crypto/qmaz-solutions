name: Run website
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "on = publish the real site, off = show offline page"
        required: true
        default: "on"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare offline page
        if: ${{ inputs.mode == 'off' }}
        run: |
          mkdir offline_build
          cat > offline_build/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Site offline</title>
          <style>
          body{font-family:system-ui,sans-serif;background:#E8EDF3;color:#192436;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
          .box{text-align:center;background:#fff;border:1px solid #D4DCE6;border-radius:14px;padding:48px 40px;max-width:380px}
          h1{font-size:1.4rem;margin:0 0 8px}
          .box p{color:#5B6B82;font-size:.95rem;margin:0}
          #chatBtn{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;background:#1D5BDC;color:#fff;font-size:1.5rem;box-shadow:0 4px 14px rgba(25,36,54,.25)}
          #chatBtn:hover{background:#1546A8}
          #chatPanel{display:none;position:fixed;right:22px;bottom:92px;width:320px;max-width:calc(100vw - 44px);background:#fff;border:1px solid #D4DCE6;border-radius:14px;box-shadow:0 8px 30px rgba(25,36,54,.25);overflow:hidden;flex-direction:column}
          #chatHead{background:#1D5BDC;color:#fff;padding:14px 16px;font-weight:600;font-size:.95rem}
          #chatMsgs{padding:14px;height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:#F7F9FC}
          .m{max-width:85%;padding:9px 12px;border-radius:12px;font-size:.88rem;line-height:1.4}
          .m.bot{background:#fff;border:1px solid #D4DCE6;align-self:flex-start}
          .m.me{background:#1D5BDC;color:#fff;align-self:flex-end}
          .mewrap{align-self:flex-end;max-width:85%;display:flex;flex-direction:column;align-items:flex-end}
          .mewrap .m.me{max-width:100%}
          .st{font-size:.72rem;color:#5B6B82;margin-top:3px}
          .st.seen{color:#0B7D6A;font-weight:600}
          #chatForm{display:flex;gap:8px;padding:10px;border-top:1px solid #D4DCE6;background:#fff}
          #chatInput{flex:1;border:1px solid #D4DCE6;border-radius:8px;padding:9px 10px;font-family:inherit;font-size:.88rem}
          #chatInput:focus{outline:2px solid #1D5BDC}
          #chatSend{border:none;border-radius:8px;background:#1D5BDC;color:#fff;font-family:inherit;font-weight:600;font-size:.88rem;padding:9px 14px;cursor:pointer}
          #chatSend:disabled{opacity:.6}
          #nameRow{padding:10px 10px 0;background:#fff;border-top:1px solid #D4DCE6}
          #nameInput{width:100%;box-sizing:border-box;border:1px solid #D4DCE6;border-radius:8px;padding:8px 10px;font-family:inherit;font-size:.85rem}
          #nameInput:focus{outline:2px solid #1D5BDC}
          </style>
          </head>
          <body>
          <div class="box"><h1>This site is offline</h1><p>It has not been run yet. Please check back later.</p></div>

          <button id="chatBtn" aria-label="Chat with the owner">&#128172;</button>
          <div id="chatPanel">
            <div id="chatHead">Message the owner</div>
            <div id="chatMsgs"></div>
            <div id="nameRow"><input id="nameInput" type="text" placeholder="Your name or phone/email (so the owner can reply)"></div>
            <form id="chatForm">
              <input id="chatInput" type="text" placeholder="Type your message..." autocomplete="off">
              <button type="submit" id="chatSend">Send</button>
            </form>
          </div>

          <script>
          (function(){
            'use strict';
            var API = 'https://script.google.com/macros/s/AKfycbxY4cp66xInhzCfbt1j2jcPlFqOHjrOlgFrt_4pQMWke2EwLp9wPbpl5PbqJJQlYbfP/exec';
            var panel = document.getElementById('chatPanel');
            var msgs = document.getElementById('chatMsgs');
            var opened = false;

            function addMsg(text, who){
              var d = document.createElement('div');
              d.className = 'm ' + who;
              d.textContent = text;
              msgs.appendChild(d);
              msgs.scrollTop = msgs.scrollHeight;
            }

            // my message bubble with a status line under it (sending -> sent -> seen)
            function addMe(text){
              var wrap = document.createElement('div');
              wrap.className = 'mewrap';
              var d = document.createElement('div');
              d.className = 'm me';
              d.textContent = text;
              var st = document.createElement('span');
              st.className = 'st';
              st.textContent = 'sending...';
              wrap.appendChild(d);
              wrap.appendChild(st);
              msgs.appendChild(wrap);
              msgs.scrollTop = msgs.scrollHeight;
              return st;
            }

            // the script started deploying the site: wait for it to come online, then open it
            var waitingForSite = false;
            function waitForSiteLive(){
              if (waitingForSite) return;
              waitingForSite = true;
              var tries = 0;
              var iv = setInterval(function(){
                tries++;
                if (tries > 24){
                  clearInterval(iv);
                  waitingForSite = false;
                  addMsg('It is taking a little longer than usual - please reload this page in a minute.', 'bot');
                  return;
                }
                fetch(location.pathname + '?live=' + Date.now(), { cache: 'no-store' })
                  .then(function(r){ return r.text(); })
                  .then(function(t){
                    if (t.indexOf('This site is offline') === -1){
                      clearInterval(iv);
                      addMsg('The site is ready - opening it now!', 'bot');
                      setTimeout(function(){
                        location.replace(location.pathname + '?v=' + Date.now());
                      }, 1200);
                    }
                  }).catch(function(){ /* try again next tick */ });
              }, 15000);
            }

            // keep asking the owner's script whether the email was read, for up to 20 min
            function pollSeen(token, st){
              var tries = 0;
              var iv = setInterval(function(){
                tries++;
                if (tries > 80){ clearInterval(iv); return; }
                fetch(API, {
                  method: 'POST',
                  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                  body: JSON.stringify({ action: 'msg_status', token: token })
                }).then(function(r){ return r.json(); }).then(function(d){
                  if (d && d.ok && d.seen){
                    clearInterval(iv);
                    st.textContent = '✓✓ The message has been seen by the admin';
                    st.className = 'st seen';
                    msgs.scrollTop = msgs.scrollHeight;
                  }
                }).catch(function(){});
              }, 15000);
            }

            document.getElementById('chatBtn').addEventListener('click', function(){
              var open = panel.style.display === 'flex';
              panel.style.display = open ? 'none' : 'flex';
              if (!open && !opened){
                opened = true;
                addMsg('Hi! This site is offline right now. Leave a message and the owner will get it by email straight away. Add your contact above so they can reply.', 'bot');
              }
              if (!open){ try { document.getElementById('chatInput').focus(); } catch(e){} }
            });

            document.getElementById('chatForm').addEventListener('submit', function(ev){
              ev.preventDefault();
              var inp = document.getElementById('chatInput');
              var text = inp.value.trim();
              if (!text) return;
              var from = document.getElementById('nameInput').value.trim();
              var st = addMe(text);
              inp.value = '';
              var btn = document.getElementById('chatSend');
              btn.disabled = true;
              fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'contact', message: text, from: from, page: location.href })
              }).then(function(r){ return r.json(); }).then(function(d){
                btn.disabled = false;
                if (d && d.ok){
                  st.textContent = '✓ The message has been sent!';
                  if (d.token) pollSeen(d.token, st);
                  if (d.autorun){
                    addMsg('Good news! The site is starting up for you right now. It will open automatically in about a minute - please stay on this page.', 'bot');
                    waitForSiteLive();
                  }
                } else {
                  st.textContent = '✗ Could not send';
                  addMsg('Sorry, it could not be sent right now. Please try again in a while.', 'bot');
                }
              }).catch(function(){
                btn.disabled = false;
                st.textContent = '✗ Could not send';
                addMsg('Sorry, it could not be sent - please check your internet and try again.', 'bot');
              });
            });
          })();
          </script>
          </body>
          </html>
          HTMLEOF

      - name: Choose what to publish
        id: pick
        run: |
          if [ "${{ inputs.mode }}" = "off" ]; then
            echo "path=offline_build" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pick.outputs.path }}

      - id: deployment
        uses: actions/deploy-pages@v4
