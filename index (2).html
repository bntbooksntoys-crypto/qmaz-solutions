<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qmaz Solutions</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238B4DFF'/%3E%3Cpath d='M17 5 8 18h7l-1 9 9-13h-7z' fill='%23fff'/%3E%3C/svg%3E">
<script src="config.js"></script>
<script>try{if(window.parent!==window)document.documentElement.classList.add('framed')}catch(e){document.documentElement.classList.add('framed')}</script>
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#14212B;--mute:#64727D;--line:#E2E8ED;--brand:#0E7C6B;--brandSoft:#E3F3EF;--err:#B3261E;--errSoft:#FCE8E6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:10px}
html.framed header{display:none}
.pill{display:flex;align-items:center;gap:10px;background:#AEC8FF;border-radius:14px;padding:6px 14px 6px 8px}
.pill .lg{width:28px;height:28px;border-radius:8px;background:#8B4DFF;display:grid;place-items:center}
.pill .lg svg{width:16px;height:16px}
.pill b{font-size:14px;display:block;line-height:1.1}.pill span{font-size:10px;color:#4A5A8A}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;position:relative}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600}
.btn.go{background:var(--brand);border-color:var(--brand);color:#fff}
.av{width:34px;height:34px;border-radius:50%;background:#8B4DFF;color:#fff;font-weight:700;display:grid;place-items:center;border:0;overflow:hidden;font-size:15px}
.av img{width:100%;height:100%;object-fit:cover}
.menu{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);min-width:200px;padding:6px;z-index:20}
.menu .who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}.menu .who b{display:block;font-size:14px}.menu .who span{font-size:12px;color:var(--mute);word-break:break-all}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;font-size:14px}.menu button:hover{background:var(--bg)}
main{flex:1;width:100%;max-width:900px;margin:0 auto;padding:22px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
/* landing */
.land{text-align:center;padding:70px 16px}
.land h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin-bottom:12px}
.land p{color:var(--mute);max-width:520px;margin:0 auto 22px;line-height:1.6}
.land .row{display:flex;gap:10px;justify-content:center}
.framedmsg{text-align:center;max-width:560px;margin:0 auto;padding:70px 16px;font-size:18px;line-height:1.6;color:var(--mute)}
/* auth */
.authwrap{max-width:420px;margin:24px auto}
.back{display:inline-block;margin-bottom:12px;font-size:12px;color:var(--brand);text-decoration:none;font-weight:600}
.auth{padding:28px}.auth h2{font-size:32px;font-weight:800;margin-bottom:6px}.auth .sub{font-size:13px;color:var(--mute);margin-bottom:12px;line-height:1.5}
label{display:block;font-size:11px;font-weight:600;color:var(--mute);margin:12px 0 5px}
.f{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 13px;font-size:14px;outline:none;font-family:inherit}
.f:focus{border-color:var(--brand)}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}.chk input{width:16px;height:16px;accent-color:var(--brand)}
.primary{width:100%;margin-top:18px;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:12px;font-weight:700;font-size:14px}
.primary:disabled{opacity:.6;cursor:wait}
.err{background:var(--errSoft);color:var(--err);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:6px}
.sw{text-align:center;font-size:14px;color:var(--mute);margin-top:16px}.sw a{color:var(--brand);font-weight:700}
.two{display:flex;gap:8px;margin-top:14px}.two .btn{font-size:12px;padding:7px 12px}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 120px);min-height:420px;overflow:hidden}
html.framed .chat{height:calc(100vh - 44px)}
.ch{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.ch .dot{width:9px;height:9px;border-radius:99px;background:#2DB67D}.ch small{margin-left:auto;color:var(--mute);font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.msg.bot{background:var(--brandSoft);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.typing{opacity:.6;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:12px}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.cf{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.cf input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px;font-size:14px;outline:none}.cf button{border:0;background:var(--brand);color:#fff;border-radius:10px;padding:0 18px;font-weight:700}
/* photo dialog */
.bg{position:fixed;inset:0;background:rgba(10,20,26,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:18px;max-width:380px;width:100%;padding:22px;text-align:center}
.dlg h3{margin-bottom:12px}.dlg video,.dlg canvas,.dlg .prev{width:240px;height:240px;border-radius:50%;object-fit:cover;background:#111;margin:0 auto 12px;display:block}
.dlg .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.dlg .note{font-size:12px;color:var(--mute);margin-bottom:10px}
</style>
</head>
<body>
<header>
  <a class="pill" href="#/" style="text-decoration:none;color:inherit"><div class="lg"><svg viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg></div><div><b>Qmaz Solutions</b><span>Dashboard</span></div></a>
  <div class="hright">
    <span id="guestBtns" hidden><button class="btn" onclick="location.hash='#/signin'">Login</button> <button class="btn go" onclick="location.hash='#/signup'">Start for Free</button></span>
    <button class="av" id="avBtn" hidden onclick="toggleMenu(event)"></button>
    <div class="menu" id="menu" hidden>
      <div class="who"><b id="mName"></b><span id="mMail"></span></div>
      <button onclick="openPhoto()">Change photo</button><button onclick="signOut()">Sign out</button>
    </div>
  </div>
</header>
<main id="main"></main>
<div class="bg" id="photoBg" hidden></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FRAMED=document.documentElement.classList.contains('framed');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ADMIN={email:'admin@qmazsolutions.com',pass:'123456'};
const OK_PARENTS=['https://bntbooksntoys-crypto.github.io','http://localhost:3000','http://127.0.0.1:3000'];
function parentOrigin(){let o='';try{o=(location.ancestorOrigins&&location.ancestorOrigins[0])||''}catch(e){}
  if(!o&&document.referrer){try{o=new URL(document.referrer).origin}catch(e){}}return OK_PARENTS.indexOf(o)>=0?o:''}
const session=()=>store.get('qmaz_session',null);
const photoOf=e=>store.get('qmaz_photo:'+e,'');
async function hash(pw){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('qmaz:'+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'qmaz:'+pw)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'x'+h.toString(16)}}

/* ---- backend ---- */
async function api(path,body){
  if(!window.QMAZ_BACKEND)throw Object.assign(new Error("The Qmaz service isn't connected yet."),{code:'not_set'});
  let data={};
  try{const r=await fetch(window.QMAZ_BACKEND,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:path},body))});data=await r.json()}
  catch(e){throw Object.assign(new Error("Can't reach the Qmaz service. Check your internet connection."),{code:'offline'})}
  if(data.error)throw Object.assign(new Error(data.error),{code:data.code});
  return data;
}

/* ---- parent (QE) bridge ---- */
function tellParent(){
  if(!FRAMED)return; const o=parentOrigin(); if(!o)return;
  const s=session();
  window.parent.postMessage({type:'qmaz-profile',signedIn:!!s,name:s?s.name:'',email:s?s.email:'',photo:s?photoOf(s.email):''},o);
}
window.addEventListener('message',e=>{
  if(e.source!==window.parent||!e.data||e.data.type!=='qmaz-cmd')return;
  const c=e.data.cmd,s=session();
  if(c==='photo'&&s)openPhoto();
  else if(c==='signout'&&s)signOut();
  else if(c==='signin'&&!s)location.hash='#/signin';
  else if(c==='signup'&&!s)location.hash='#/signup';
});

/* ---- header ---- */
function paintHeader(){
  const s=session(),av=$('avBtn');
  $('guestBtns').hidden=!!s||(location.hash||'#/')!=='#/';
  av.hidden=!s;$('menu').hidden=true;
  if(s){const p=photoOf(s.email);av.innerHTML=p?'<img alt="" src="'+esc(p)+'">':esc((s.name||'?').trim().charAt(0).toUpperCase());
    $('mName').textContent=s.name;$('mMail').textContent=s.email;}
}
function toggleMenu(e){e.stopPropagation();$('menu').hidden=!$('menu').hidden}
document.addEventListener('click',()=>{$('menu').hidden=true});
function signOut(){store.del('qmaz_session');sessionStorage.removeItem('qmaz_pending');greeted=false;location.hash='#/';route();}

/* ---- views ---- */
function landing(){
  if(FRAMED)return'<div class="framedmsg">Qmaz is a friendly assistant for your school work. Sign in to start chatting, and keep your profile and photo across Quality Education.</div>';
  return'<div class="land"><h1>Meet Qmaz, your school helper</h1><p>Ask questions, get clear answers, and keep your profile across Quality Education.</p><div class="row"><button class="btn go" onclick="location.hash=\'#/signup\'">Start for Free</button><button class="btn" onclick="location.hash=\'#/signin\'">Login</button></div></div>';
}
const GRADES=Array.from({length:12},(_,i)=>'<option>Grade '+(i+1)+'</option>').join('');
function authView(mode){
  const up=mode==='up';
  return'<section class="authwrap"><a class="back" href="#/">← Back to home</a><div class="card auth"><h2>'+(up?'Create account':'Login')+'</h2>'+
  (up?'<p class="sub">We will email you a 6-digit code to verify your address.</p>':'')+
  '<div id="err" class="err" hidden></div><form id="af" novalidate>'+
  (up?'<label for="aN">Full name</label><input class="f" id="aN" autocomplete="name">':'')+
  '<label for="aE">Email</label><input class="f" id="aE" type="email" autocomplete="email">'+
  '<label for="aP">Password</label><input class="f" id="aP" type="password" autocomplete="'+(up?'new-password':'current-password')+'">'+
  (up?'<label for="aC">Confirm password</label><input class="f" id="aC" type="password" autocomplete="new-password">':'')+
  '<label for="aG">Grade</label><select class="f" id="aG">'+GRADES+'</select>'+
  '<label class="chk"><input type="checkbox" id="sp"> Show password</label>'+
  '<button class="primary" id="ab" type="submit">'+(up?'Send code':'Login')+'</button></form>'+
  '<p class="sw">'+(up?'Already have an account? <a href="#/signin">Login</a>':'Don\'t have an account? <a href="#/signup">Signup</a>')+'</p></div></section>';
}
function otpView(p){
  return'<section class="authwrap"><div class="card auth"><h2>Check your inbox</h2><p class="sub">We sent a 6-digit code to <b>'+esc(p.email)+'</b>. It can take a minute — check Spam too.</p>'+
  '<div id="err" class="err" hidden></div><form id="of" novalidate><label for="oC">6-digit code</label><input class="f" id="oC" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">'+
  '<button class="primary" id="ob" type="submit">Verify and create account</button></form>'+
  '<div class="two"><button class="btn" type="button" id="rs">Resend code</button><button class="btn" type="button" onclick="sessionStorage.removeItem(\'qmaz_pending\');location.hash=\'#/signup\'">Change email</button></div></div></section>';
}
function showErr(m){const e=$('err');if(!e)return;e.hidden=!m;e.textContent=m||''}
function wireShow(){const sp=$('sp');if(!sp)return;sp.onchange=()=>{['aP','aC'].forEach(i=>{if($(i))$(i).type=sp.checked?'text':'password'})}}

function startSession(u){store.set('qmaz_session',{name:u.name,email:u.email,grade:u.grade,admin:!!u.admin});}

function wireAuth(up){
  wireShow();
  $('af').addEventListener('submit',async e=>{
    e.preventDefault();
    const email=$('aE').value.trim().toLowerCase(),pass=$('aP').value,grade=$('aG').value;
    if(!/^\S+@\S+\.\S+$/.test(email))return showErr('Enter a valid email address.');
    if(!up&&email===ADMIN.email&&pass===ADMIN.pass){startSession({name:'Admin',email:ADMIN.email,grade:grade,admin:true});location.hash='#/';route();return;}
    if(pass.length<6)return showErr('Password must be at least 6 characters.');
    const users=store.get('qmaz_users',[]);
    $('ab').disabled=true;
    try{
      const h=await hash(pass);
      if(!up){
        const u=users.find(x=>x.email===email);
        if(!u)return showErr('No account found with this email. Sign up first.');
        if(u.hash!==h)return showErr('Incorrect password.');
        startSession({name:u.name,email:u.email,grade:grade||u.grade});location.hash='#/';route();return;
      }
      const name=$('aN').value.trim();
      if(!name)return showErr('Enter your name.');
      if(pass!==$('aC').value)return showErr('Passwords do not match.');
      if(email===ADMIN.email||users.some(x=>x.email===email))return showErr('An account with this email already exists. Login instead.');
      await api('send-code',{email:email,name:name});
      sessionStorage.setItem('qmaz_pending',JSON.stringify({name:name,email:email,grade:grade,hash:h}));
      location.hash='#/signup/one-time-password';
    }catch(err){showErr(err.message)}finally{const b=$('ab');if(b)b.disabled=false}
  });
}
function wireOtp(p){
  $('rs').onclick=async()=>{try{await api('send-code',{email:p.email,name:p.name});showErr('')}catch(e){showErr(e.message)}};
  $('of').addEventListener('submit',async e=>{
    e.preventDefault();const code=$('oC').value.trim();
    if(!/^\d{6}$/.test(code))return showErr('Enter the 6-digit code.');
    $('ob').disabled=true;
    try{
      await api('verify-code',{email:p.email,code:code});
      const users=store.get('qmaz_users',[]);
      users.push({name:p.name,email:p.email,grade:p.grade,hash:p.hash,createdAt:new Date().toISOString()});
      store.set('qmaz_users',users);startSession(p);sessionStorage.removeItem('qmaz_pending');location.hash='#/';route();
    }catch(err){showErr(err.message)}finally{const b=$('ob');if(b)b.disabled=false}
  });
}

/* ---- chat ---- */
let greeted=false,history=[];
const CHIPS=['What is Qmaz Solutions?','How can I contact you?'];
function chatView(){
  return'<div class="card chat"><div class="ch"><span class="dot"></span><b>Qmaz Assistant</b><small>Ask me anything</small></div><div class="msgs" id="msgs" aria-live="polite"></div><div class="chips" id="chips">'+
  CHIPS.map(c=>'<button class="chip" type="button">'+esc(c)+'</button>').join('')+'</div><form class="cf" id="cf"><input id="ct" placeholder="Type your message…" autocomplete="off"><button type="submit">Send</button></form></div>';
}
function addMsg(t,w){const d=document.createElement('div');d.className='msg '+w;d.textContent=t;$('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d}
async function send(text){
  text=text.trim();if(!text)return;addMsg(text,'user');history.push({role:'user',content:text});
  const w=addMsg('Typing…','bot');w.classList.add('typing');
  const s=session()||{};
  try{
    const r=await api('chat',{message:text,messages:history.slice(-12),history:history.slice(-12),name:s.name||'',grade:s.grade||''});
    const reply=String(r.reply||r.text||'').trim()||"Sorry, I didn't get an answer. Try again.";
    w.remove();addMsg(reply,'bot');history.push({role:'assistant',content:reply});
  }catch(e){w.remove();addMsg(e.code==='not_set'?"The AI isn't connected yet.":e.message,'bot')}
}
function wireChat(){
  const s=session();
  if(!greeted){greeted=true;history=[];}
  $('msgs').innerHTML='';
  addMsg('Hi '+((s.name||'').split(' ')[0]||'there')+"! I'm the Qmaz Solutions assistant. How can I help you today?",'bot');
  $('cf').addEventListener('submit',e=>{e.preventDefault();const v=$('ct').value;$('ct').value='';send(v)});
  $('chips').addEventListener('click',e=>{if(e.target.classList.contains('chip'))send(e.target.textContent)});
}

/* ---- photo ---- */
let stream=null;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function closePhoto(){stopCam();$('photoBg').hidden=true;$('photoBg').innerHTML=''}
function openPhoto(){
  const s=session();if(!s)return;
  const bg=$('photoBg');bg.hidden=false;
  bg.innerHTML='<div class="dlg"><h3>Change photo</h3><div id="stage"><div class="prev" style="display:grid;place-items:center;color:#fff;font-size:60px">'+(photoOf(s.email)?'<img style="width:100%;height:100%;border-radius:50%;object-fit:cover" src="'+esc(photoOf(s.email))+'">':esc((s.name||'?').charAt(0).toUpperCase()))+'</div></div>'+
  '<p class="note" id="pn"></p><div class="row"><button class="btn go" id="pc">Use camera</button><button class="btn" id="pu">Choose from files</button><button class="btn" id="px">Close</button></div><input type="file" id="pf" accept="image/*" hidden></div>';
  $('px').onclick=closePhoto;
  $('pu').onclick=()=>$('pf').click();
  $('pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>fit(r.result);r.readAsDataURL(f)};
  $('pc').onclick=async()=>{
    try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
      $('stage').innerHTML='<video id="vd" autoplay playsinline muted></video>';$('vd').srcObject=stream;
      $('pc').textContent='Take photo';$('pc').onclick=()=>{const v=$('vd'),c=document.createElement('canvas');c.width=c.height=256;const m=Math.min(v.videoWidth,v.videoHeight);
        c.getContext('2d').drawImage(v,(v.videoWidth-m)/2,(v.videoHeight-m)/2,m,m,0,0,256,256);stopCam();save(c.toDataURL('image/jpeg',.85))}}
    catch(e){$('pn').textContent="Couldn't open the camera. Choose a file instead."}
  };
}
function fit(src){const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,256,256);save(c.toDataURL('image/jpeg',.85))};i.src=src}
function save(d){const s=session();if(!s)return;store.set('qmaz_photo:'+s.email,d);closePhoto();paintHeader();tellParent()}

/* ---- router ---- */
function route(){
  const s=session(),h=location.hash||'#/',m=$('main');
  paintHeader();
  if(h==='#/signup/one-time-password'){
    if(s){location.hash='#/';return}
    let p=null;try{p=JSON.parse(sessionStorage.getItem('qmaz_pending')||'null')}catch(e){}
    if(!p){location.hash='#/signup';return}
    m.innerHTML=otpView(p);wireOtp(p);tellParent();return;
  }
  if(h==='#/signin'||h==='#/signup'){
    if(s){location.hash='#/';return}
    m.innerHTML=authView(h==='#/signup'?'up':'in');wireAuth(h==='#/signup');tellParent();return;
  }
  if(s){m.innerHTML=chatView();wireChat()}else m.innerHTML=landing();
  tellParent();
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
